# Resources:
# tmux manual - https://github.com/tmux/tmux/wiki/Getting-Started
# Config tutorial - https://micahkepe.com/blog/tmux-config/
# Some "sensible" defaults - https://github.com/tmux-plugins/tmux-sensible
# "Pain control" defaults - https://github.com/tmux-plugins/tmux-pain-control
# Starting point for tmux sessionizer - https://github.com/ThePrimeagen/tmux-sessionizer
#       Check this one out too - https://github.com/jrmoulton/tmux-sessionizer
# Need to manually install the plugin manager:
#       git clone https://github.com/tmux-plugins/tpm ${TMUX_PLUGINS}/tpm

# Requires fuzzy finder, install as so:
# mkdir -p ~/.local/bin
# cd "$(mktemp -d)"
# 
# ver=$(curl -s https://api.github.com/repos/junegunn/fzf/releases/latest \
#   | grep -Po '"tag_name": "v\K[^"]+')
# arch=$(dpkg --print-architecture)   # amd64 or arm64
# 
# curl -fLO "https://github.com/junegunn/fzf/releases/download/v${ver}/fzf-${ver}-linux_${arch}.tar.gz"
# tar xzf "fzf-${ver}-linux_${arch}.tar.gz"
# install -m 755 fzf ~/.local/bin/fzf

# Environment variables
TMUX_CONFIG_ROOT="${HOME}/.config/tmux"
TMUX_PLUGINS="${TMUX_CONFIG_ROOT}/plugins"
TMUX_SCRIPTS="${TMUX_CONFIG_ROOT}/scripts"
TMUX_LOGS="${HOME}/.local/share/tmux"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "${TMUX_PLUGINS}"

# Coloring
set -g default-terminal "tmux-256color"                 # What $TERM programs inside tmux see (e.g. vim, nvim)
set -as terminal-features ",xterm-256color:RGB:usstyle" # tell tmux outer terminal supports RGB and squggly underlines (undercurl)

# Settings
set -g status-position bottom       # Move the status bar to the top/bottom
set -g status-keys emacs            # Emacs key bindings for the command prompt, leader + :
setw -g mode-keys vi                # vi bindings for copy mode, ctrl + [
set -g mouse on                     # Mouse control
set -g set-clipboard on             # Clipboard passthrough
set -g base-index 1                 # Windows index 0 makes you span the keyboard
setw -g pane-base-index 1           # Panes index 0 makes you span the keyboard
set -g renumber-windows on          # Auto-renumber windows when one closes
bind-key S set -g status            # Toggle status line on/off
bind ';' command-prompt             # Saves one keystroke from ':'
set -g automatic-rename-format "-"  # Default name for new windows in a session
set -gF window-status-separator ""  # Remove the seperation between status bar windows list
bind S-Left select-pane -L -Z       # Move pane left while in full screen
bind S-Down select-pane -D -Z       # Move pane down while in full screen
bind S-Up select-pane -U -Z         # Move pane up while in full screen
bind S-Right select-pane -R -Z      # Move pane right while in full screen
# Sensible defaults
set -s escape-time 0                # Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -g history-limit 50000          # Increase scrollback buffer size from 2000 to 50000 lines
set -g display-time 6000            # Increase tmux messages display duration from 750ms to 4s
set -g status-interval 5            # Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g focus-events on              # Focus events enabled for terminals that support them
setw -g aggressive-resize on        # Super useful when using "grouped sessions" and multi-monitor setup
# Pain control - navigation
bind-key C-h select-pane -L         # One pane left
bind-key C-j select-pane -D         # One pane down
bind-key C-k select-pane -U         # One pane up
bind-key C-l select-pane -R         # One pane right
# Pain control - resize panes
pane_resize="5"
bind-key -r H resize-pane -L "$pane_resize"     # Resize pane left
bind-key -r J resize-pane -D "$pane_resize"     # Resize pane down
bind-key -r K resize-pane -U "$pane_resize"     # Resize pane up
bind-key -r L resize-pane -R "$pane_resize"     # Resize pane right
# Pain control - new panes and windows
bind-key "\\" split-window -h                               # Split pane horizontal
bind-key "|" split-window -fh                               # Add full height
bind-key "C-\\" split-window -h -c "#{pane_current_path}"   # Use current dir
bind-key "C-|" split-window -fh -c "#{pane_current_path}"   # Add full height, use current dir
bind-key "-" split-window -v                                # Split pane vertical
bind-key "_" split-window -fv                               # Add full height
bind-key "C--" split-window -v -c "#{pane_current_path}"    # Use current dir
bind-key "C-_" split-window -fv -c "#{pane_current_path}"   # Add full height, use current dir

# Key bindings
bind C-p previous-window            # Easier switch to previous window
bind C-n next-window                # Easier switch to next window
bind c command-prompt -p "Window name:" "if-shell '[ -n \"%1\" ]' 'new-window -n \"%1\"' 'new-window -n -'" # Prompt for name when making new windows
bind R source-file "${TMUX_CONFIG_ROOT}/tmux.conf"                  # Reload the config
# vi bindings for copy mode, ctrl + [
bind-key -T copy-mode-vi v send -X begin-selection                  # Visual mode
bind-key -T copy-mode-vi V send -X select-line                      # visual line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'    # yank to system clipboard
# Custom scripts
bind j display-popup -E "${TMUX_SCRIPTS}/session_fzf.sh"            # Fuzzy-find a session to open
bind f run-shell "tmux neww ${TMUX_SCRIPTS}/tmux-sessionizer.sh"    # Fuzzy-find a directory to start a session in

# Plugins
set -g @plugin 'tmux-plugins/tpm'               # Plugin manager
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Revive tmux sessions after system boot
set -g @plugin 'tmux-plugins/tmux-continuum'    # Save the session routinely
set -g @plugin 'tmux-plugins/tmux-logging'      # Log files
set -g @plugin 'catppuccin/tmux#v2.3.1'         # Catppuccin theme
# Continuum boot settings
set -g @continuum-boot 'on'                     # Start tmux on system boot
set -g @continuum-boot-options 'alacritty'      # Set alacritty as the default terminal
set -g @continuum-save-interval '10'            # Auto-save interval time in minutes
# Logging settings
set -g @logging-path "${TMUX_LOGS}/logging"     # Log directory
# Catppuccin settings
set -g @catppuccin_flavor "mocha"               # Flavors:  latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "basic"  # Styles:   basic, rounded, slanted, custom, none
set -g @catppuccin_status_background "default"  # Background of status bar
set -g @catppuccin_status_left_separator "█"    # Space to left of status items
set -g @catppuccin_status_right_separator "█"   # Space to right of status items
set -g @catppuccin_pane_active_border_style "fg=#{@thm_mauve}"  # Color of active pane indicator
# Catppuccin custom status line text
set -g @catppuccin_directory_text       " #{b:#{d:session_path}}/#{b:session_path}"     # Full path to the session's home directory
set -g @catppuccin_window_text          " #{window_name} #{?window_zoomed_flag,[Z],}"   # Displayed when window is inactive
set -g @catppuccin_window_current_text  " #{window_name}:#{b:pane_current_command}#{?window_zoomed_flag, *Z,}" # Same for active window
# Catppuccin custom status line items
set -g status-right-length 100                  # Right status spacing
set -g status-left-length 100                   # Left status spacing
set -g status-justify right                     # Right justify the windows list
set -g status-left ""                           # Clear the left bar
set -g status-right ""                          # Clear the right bar
set -ag status-left "#{E:@catppuccin_status_session}"   # Session name
set -ag status-left "#{E:@catppuccin_status_directory}" # Prints @catppuccin_directory_text
# Run the plugin manager
run "${TMUX_PLUGINS}/tpm/tpm"


#################### NESTED TMUX SESSIONS ####################
# Allows disabling the outer tmux session when in nested sessions 
# Adapted from https://gist.github.com/samoshkin/05e65f7f1c9b55d3fc7690b59d678734
# Colors for indicating outer session is off
color_status_text="colour246"
color_window_off_status_bg="colour238"
color_dark="colour232"
color_window_off_status_current_bg="colour254"

# Freeze the outer session
bind -T root F12 \
    set prefix None \; \
    set key-table off \; \
    set -gF @saved_status "#{status}" \; \
    set -gF @saved_status_style "#{status-style}" \; \
    set -g status on \; \
    set -g status-style "bg=default" \; \
    set -g status-format[0] "#[align=right,fg=black,bg=yellow,bold] OUTER TMUX OFF #[nobold,fg=yellow,bg=default] F12 to resume " \; \
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \; \
    if -F '#{==:#{window_zoomed_flag},0}' 'resize-pane -Z' \; \
    refresh-client -S
#set -g status off \; \

# Restore the outer session
bind -T off F12 \
    set -u prefix \; \
    set -u key-table \; \
    set -gF status "#{@saved_status}" \; \
    set -gF status-style "#{@saved_status_style}" \; \
    set -gu status-format \; \
    resize-pane -Z \; \
    refresh-client -S

# Restore the outer session

# Add an off indicator to the right of Catppuccin's status bar
set -ag status-left "#{?#{==:#{client_key_table},off}, #[fg=black bg=yellow] OFF #[default],}"

  
