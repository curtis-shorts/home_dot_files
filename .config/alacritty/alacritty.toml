# ~/.config/alacritty/alacritty.toml

[window]
decorations = "none"
#decorations = "full"
dynamic_padding = true
opacity = 0.95
startup_mode = "Windowed"
padding = { x = 6, y = 6 }

[font]
size = 11.0

[font.normal]
#family = "JetBrainsMono Nerd Font"
#style = "Regular"

[font.bold]
#family = "JetBrainsMono Nerd Font"
#style = "Bold"

[font.italic]
#family = "JetBrainsMono Nerd Font"
#style = "Italic"

[scrolling]
history = 10000
multiplier = 5

[cursor]
style = { shape = "Block", blinking = "Off" }

[colors.primary]
#background = "0x1e1e2e"
#foreground = "0xcdd6f4"

[colors.cursor]
#text = "0x1e1e2e"
#cursor = "0xcdd6f4"

[colors.selection]
#text = "0x1e1e2e"
#background = "0x89b4fa"

[terminal.shell]
program = "/usr/bin/bash"
args = ["--login"]
#args = ["--login", "color_prompt=yes"]

[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "N", mods = "Control|Shift", action = "SpawnNewInstance" }
]

[terminal]

